services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: dispoller
      POSTGRES_PASSWORD: dispoller
      POSTGRES_DB: dispoller_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispoller -d dispoller_test"]
      interval: 1s
      timeout: 2s
      retries: 15
